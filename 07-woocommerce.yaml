#cloud-config
# Debian 13 (trixie) only. One fresh VPS per application.
# WooCommerce + WordPress + MariaDB
package_update: false
disable_root: false
ssh_pwauth: true
# CUSTOMER: change plain_text_passwd below before production. Default is for lab/testing only.
# Keep the password quoted. Avoid YAML-special characters like ! : # etc.
chpasswd:
  expire: false
users:
- name: root
  lock_passwd: false
  plain_text_passwd: "VpsApp-ChangeMe-2026"
write_files:
- path: /etc/ssh/sshd_config.d/60-vps-provider-root.conf
  owner: "root:root"
  permissions: "0644"
  content: |
    PermitRootLogin yes
    PasswordAuthentication yes
    KbdInteractiveAuthentication yes
    UsePAM yes
- path: /usr/local/sbin/vps-app-bootstrap
  owner: "root:root"
  permissions: "0700"
  content: |
    #!/usr/bin/env bash
    set -Eeuo pipefail
    umask 077
    export DEBIAN_FRONTEND=noninteractive
    APP="07-woocommerce"
    ROOT="/opt/vps-apps/$APP"
    mkdir -p "$ROOT" /var/log/vps-apps
    exec > >(tee -a "/var/log/vps-apps/$APP-bootstrap.log") 2>&1
    trap 'echo "ERROR in $APP bootstrap at line $LINENO. Check /var/log/vps-apps/$APP-bootstrap.log" >&2' ERR
    
    assert_debian13() {
      . /etc/os-release
      if [[ "${ID:-}" != "debian" || "${VERSION_ID:-}" != "13" ]]; then
        echo "This cloud-init file supports Debian 13 only." >&2; exit 1
      fi
      case "$(dpkg --print-architecture)" in amd64|arm64) ;; *) echo 'Unsupported CPU architecture' >&2; exit 1;; esac
    }
    base_packages() {
      apt-get update -qq
      apt-get install -y -qq --no-install-recommends ca-certificates curl gnupg openssl git jq unzip python3
    }
    install_docker() {
      if docker compose version >/dev/null 2>&1; then systemctl enable --now docker; return; fi
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
      chmod 0644 /etc/apt/keyrings/docker.asc
      cat > /etc/apt/sources.list.d/docker.sources <<EOF
    Types: deb
    URIs: https://download.docker.com/linux/debian
    Suites: trixie
    Components: stable
    Architectures: $(dpkg --print-architecture)
    Signed-By: /etc/apt/keyrings/docker.asc
    EOF
      apt-get update -qq
      apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      systemctl enable --now docker
      docker compose version
    }
    create_test_http() {
      local port="$1" urlpath="${2:-/}" protocol="${3:-http}"
      cat > /usr/local/sbin/vps-app-test <<EOF
    #!/usr/bin/env bash
    set -Eeuo pipefail
    echo 'Service: $APP'
    echo 'Checking ${protocol}://127.0.0.1:${port}${urlpath}'
    curl -k -sS -o /dev/null -w 'HTTP status: %{http_code}\n' --max-time 15 '${protocol}://127.0.0.1:${port}${urlpath}'
    echo 'Container status:'
    cd '$ROOT'
    docker compose ps
    EOF
      chmod 0750 /usr/local/sbin/vps-app-test
    }

    wait_for_clock() {
      # ConfigDrive VMs often boot at 1970; TLS cert checks then break apt/docker.
      echo "Boot clock: $(date -u)"
      timedatectl set-ntp true 2>/dev/null || true
      systemctl start systemd-timesyncd 2>/dev/null || systemctl start chrony 2>/dev/null || true

      set_clock_from_http() {
        local host="$1" path="${2:-/}"
        command -v python3 >/dev/null 2>&1 || return 1
        python3 - "$host" "$path" <<'PYCLOCK'
    import re, socket, subprocess, sys
    from email.utils import parsedate_to_datetime
    host, path = sys.argv[1], sys.argv[2]
    sock = socket.create_connection((host, 80), timeout=8)
    req = "HEAD {} HTTP/1.0\r\nHost: {}\r\n\r\n".format(path, host)
    sock.sendall(req.encode("ascii"))
    data = b""
    while True:
        buf = sock.recv(4096)
        if not buf:
            break
        data += buf
        if len(data) > 16384:
            break
    sock.close()
    text = data.decode("latin1", "replace")
    match = re.search(r"(?im)^date:\s*(.+)$", text)
    if not match:
        sys.exit(1)
    stamp = parsedate_to_datetime(match.group(1).strip()).strftime("%Y-%m-%d %H:%M:%S UTC")
    subprocess.check_call(["date", "-u", "-s", stamp])
    print(stamp)
    PYCLOCK
      }

      local year
      for _ in $(seq 1 30); do
        year="$(date -u +%Y)"
        if [[ "$year" =~ ^[0-9]+$ ]] && (( year >= 2024 )); then
          echo "System clock OK: $(date -u)"
          return 0
        fi
        if set_clock_from_http deb.debian.org / \
          || set_clock_from_http 1.1.1.1 / \
          || set_clock_from_http google.com /; then
          echo "Set clock via HTTP Date: $(date -u)"
        fi
        sleep 2
      done
      echo "ERROR: system clock still wrong ($(date -u)); refusing apt/HTTPS installs" >&2
      return 1
    }

    assert_debian13
    wait_for_clock
    if [[ -f "$ROOT/.bootstrap-complete" ]]; then echo "$APP was provisioned already. Inspect $ROOT"; exit 0; fi
    base_packages
    
    install_docker
    
    cd "$ROOT"
    if [[ ! -f .env ]]; then
      cat > .env <<EOF
    DB_PASSWORD=$(openssl rand -hex 24)
    DB_ROOT_PASSWORD=$(openssl rand -hex 24)
    EOF
      chmod 0600 .env
    fi
    cat > compose.yaml <<'YAML'
    services:
      db:
        image: mariadb:11.4
        restart: unless-stopped
        environment:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: ${DB_PASSWORD}
          MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
          - db_data:/var/lib/mysql
        healthcheck:
          test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
          interval: 10s
          timeout: 5s
          retries: 20
      wordpress:
        image: wordpress:php8.3-apache
        restart: unless-stopped
        depends_on:
          db:
            condition: service_healthy
        ports:
          - '8080:80'
        environment:
          WORDPRESS_DB_HOST: db:3306
          WORDPRESS_DB_USER: wordpress
          WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
          WORDPRESS_DB_NAME: wordpress
        volumes:
          - wp_data:/var/www/html
    volumes:
      db_data:
      wp_data:
    YAML
    docker compose config -q
    docker compose up -d
    
    # Stage WooCommerce files before WordPress has been initialized.
    # Activate the plugin from the WordPress dashboard after the setup wizard.
    mkdir -p "$ROOT/woocommerce-extract"
    if [[ ! -f "$ROOT/woocommerce-extract/woocommerce/woocommerce.php" ]]; then
      curl -fsSL --retry 3 https://downloads.wordpress.org/plugin/woocommerce.latest-stable.zip -o "$ROOT/woocommerce.zip"
      unzip -q -o "$ROOT/woocommerce.zip" -d "$ROOT/woocommerce-extract"
    fi
    # WordPress runs as www-data (UID 33) on the official Apache image.
    docker cp "$ROOT/woocommerce-extract/woocommerce" "$(docker compose ps -q wordpress):/var/www/html/wp-content/plugins/woocommerce"
    docker compose exec -T --user root wordpress chown -R 33:33 /var/www/html/wp-content/plugins/woocommerce
    create_test_http 8080
    
    echo "Bootstrap complete."
    touch "$ROOT/.bootstrap-complete"
    echo "FINISHED: $APP (see $ROOT)"
runcmd:
- [ bash, -lc, "systemctl reload ssh 2>/dev/null || systemctl reload sshd 2>/dev/null || true" ]
- [ bash, /usr/local/sbin/vps-app-bootstrap ]
