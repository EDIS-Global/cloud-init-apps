#cloud-config
# Debian 13 (trixie) only. One fresh VPS per application.
# Odoo 19 with PostgreSQL, loopback-bound web UI
package_update: false
disable_root: false
ssh_pwauth: true
# CUSTOMER: change plain_text_passwd below before production. Default is for lab/testing only.
# Keep the password quoted. Avoid YAML-special characters like ! : # etc.
chpasswd:
  expire: false
users:
- name: root
  lock_passwd: false
  plain_text_passwd: "VpsApp-ChangeMe-2026"
write_files:
- path: /etc/ssh/sshd_config.d/60-vps-provider-root.conf
  owner: "root:root"
  permissions: "0644"
  content: |
    PermitRootLogin yes
    PasswordAuthentication yes
    KbdInteractiveAuthentication yes
    UsePAM yes
- path: /usr/local/sbin/vps-app-bootstrap
  owner: "root:root"
  permissions: "0700"
  content: |
    #!/usr/bin/env bash
    set -Eeuo pipefail
    umask 077
    export DEBIAN_FRONTEND=noninteractive
    APP="12-odoo"
    ROOT="/opt/vps-apps/$APP"
    mkdir -p "$ROOT" /var/log/vps-apps
    exec > >(tee -a "/var/log/vps-apps/$APP-bootstrap.log") 2>&1
    trap 'echo "ERROR in $APP bootstrap at line $LINENO. Check /var/log/vps-apps/$APP-bootstrap.log" >&2' ERR
    
    assert_debian13() {
      . /etc/os-release
      if [[ "${ID:-}" != "debian" || "${VERSION_ID:-}" != "13" ]]; then
        echo "This cloud-init file supports Debian 13 only." >&2; exit 1
      fi
      case "$(dpkg --print-architecture)" in amd64|arm64) ;; *) echo 'Unsupported CPU architecture' >&2; exit 1;; esac
    }
    base_packages() {
      apt-get update -qq
      apt-get install -y -qq --no-install-recommends ca-certificates curl gnupg openssl git jq unzip python3
    }
    install_docker() {
      if docker compose version >/dev/null 2>&1; then systemctl enable --now docker; return; fi
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
      chmod 0644 /etc/apt/keyrings/docker.asc
      cat > /etc/apt/sources.list.d/docker.sources <<EOF
    Types: deb
    URIs: https://download.docker.com/linux/debian
    Suites: trixie
    Components: stable
    Architectures: $(dpkg --print-architecture)
    Signed-By: /etc/apt/keyrings/docker.asc
    EOF
      apt-get update -qq
      apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      systemctl enable --now docker
      docker compose version
    }
    create_test_http() {
      local port="$1" urlpath="${2:-/}" protocol="${3:-http}"
      cat > /usr/local/sbin/vps-app-test <<EOF
    #!/usr/bin/env bash
    set -Eeuo pipefail
    echo 'Service: $APP'
    echo 'Checking ${protocol}://127.0.0.1:${port}${urlpath}'
    curl -k -sS -o /dev/null -w 'HTTP status: %{http_code}\n' --max-time 15 '${protocol}://127.0.0.1:${port}${urlpath}'
    echo 'Container status:'
    cd '$ROOT'
    docker compose ps
    EOF
      chmod 0750 /usr/local/sbin/vps-app-test
    }

    wait_for_clock() {
      # ConfigDrive often boots with year 1970; HTTPS/apt then fail.
      timedatectl set-ntp true 2>/dev/null || true
      systemctl start systemd-timesyncd 2>/dev/null || systemctl start chrony 2>/dev/null || true
      for _ in $(seq 1 90); do
        year="$(date -u +%Y)"
        if [[ "$year" =~ ^[0-9]+$ ]] && (( year >= 2024 )); then
          echo "System clock OK: $(date -u)"
          return 0
        fi
        sleep 2
      done
      echo "WARNING: system clock still wrong ($(date -u)); package/HTTPS installs may fail" >&2
    }

    assert_debian13
    wait_for_clock
    if [[ -f "$ROOT/.bootstrap-complete" ]]; then echo "$APP was provisioned already. Inspect $ROOT"; exit 0; fi
    base_packages
    
    install_docker
    
    cd "$ROOT"
    if [[ ! -f .env ]]; then
      cat >.env <<EOF
    DB_PASSWORD=$(openssl rand -hex 24)
    ODOO_MASTER_PASSWORD=$(openssl rand -hex 24)
    EOF
      chmod 0600 .env
    fi
    mkdir -p "$ROOT/config"
    # Odoo 19 expects admin_passwd in a configuration file, not a generic CLI parameter.
    if [[ ! -f "$ROOT/config/odoo.conf" ]]; then
      . "$ROOT/.env"
      cat > "$ROOT/config/odoo.conf" <<EOF
    [options]
    admin_passwd = $ODOO_MASTER_PASSWORD
    db_host = db
    db_port = 5432
    db_user = odoo
    db_password = $DB_PASSWORD
    proxy_mode = False
    EOF
      chmod 0644 "$ROOT/config/odoo.conf"
    fi
    cat >compose.yaml <<'YAML'
    services:
      db:
        image: postgres:16
        restart: unless-stopped
        environment:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: ${DB_PASSWORD}
          POSTGRES_DB: postgres
        volumes:
          - pg_data:/var/lib/postgresql/data
        healthcheck:
          test: ['CMD-SHELL', 'pg_isready -U odoo -d postgres']
          interval: 10s
          timeout: 5s
          retries: 25
      odoo:
        image: odoo:19.0
        restart: unless-stopped
        depends_on:
          db: {condition: service_healthy}
        environment:
          HOST: db
          USER: odoo
          PASSWORD: ${DB_PASSWORD}
        volumes:
          - odoo_data:/var/lib/odoo
          - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
        ports:
          - '8069:8069'
    volumes:
      pg_data:
      odoo_data:
    YAML
    docker compose config -q
    docker compose up -d
    create_test_http 8069
    
    echo "Bootstrap complete."
    touch "$ROOT/.bootstrap-complete"
    echo "FINISHED: $APP (see $ROOT)"
runcmd:
- [ bash, -lc, "systemctl reload ssh 2>/dev/null || systemctl reload sshd 2>/dev/null || true" ]
- [ bash, /usr/local/sbin/vps-app-bootstrap ]
