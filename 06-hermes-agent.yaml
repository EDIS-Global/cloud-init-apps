#cloud-config
# Debian 13 (trixie) only. One fresh VPS per application.
# Hermes Agent: pre-pull image, finish interactive provider setup
package_update: false
disable_root: false
ssh_pwauth: true
# CUSTOMER: change root password below before production. Default is for lab/testing only.
chpasswd:
  expire: false
  list: |
    root:VpsApp-ChangeMe!
users:
- name: root
  lock_passwd: false
write_files:
- path: /etc/ssh/sshd_config.d/60-vps-provider-root.conf
  owner: root:root
  permissions: '0644'
  content: |
    PermitRootLogin yes
    PasswordAuthentication yes
    KbdInteractiveAuthentication yes
    UsePAM yes
- path: /usr/local/sbin/vps-app-bootstrap
  owner: root:root
  permissions: '0700'
  content: |
    #!/usr/bin/env bash
    set -Eeuo pipefail
    umask 077
    export DEBIAN_FRONTEND=noninteractive
    APP="06-hermes-agent"
    ROOT="/opt/vps-apps/$APP"
    mkdir -p "$ROOT" /var/log/vps-apps
    exec > >(tee -a "/var/log/vps-apps/$APP-bootstrap.log") 2>&1
    trap 'echo "ERROR in $APP bootstrap at line $LINENO. Check /var/log/vps-apps/$APP-bootstrap.log" >&2' ERR
    
    assert_debian13() {
      . /etc/os-release
      if [[ "${ID:-}" != "debian" || "${VERSION_ID:-}" != "13" ]]; then
        echo "This cloud-init file supports Debian 13 only." >&2; exit 1
      fi
      case "$(dpkg --print-architecture)" in amd64|arm64) ;; *) echo 'Unsupported CPU architecture' >&2; exit 1;; esac
    }
    base_packages() {
      apt-get update -qq
      apt-get install -y -qq --no-install-recommends ca-certificates curl gnupg openssl git jq unzip python3
    }
    install_docker() {
      if docker compose version >/dev/null 2>&1; then systemctl enable --now docker; return; fi
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
      chmod 0644 /etc/apt/keyrings/docker.asc
      cat > /etc/apt/sources.list.d/docker.sources <<EOF
    Types: deb
    URIs: https://download.docker.com/linux/debian
    Suites: trixie
    Components: stable
    Architectures: $(dpkg --print-architecture)
    Signed-By: /etc/apt/keyrings/docker.asc
    EOF
      apt-get update -qq
      apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      systemctl enable --now docker
      docker compose version
    }
    create_test_http() {
      local port="$1" urlpath="${2:-/}" protocol="${3:-http}"
      cat > /usr/local/sbin/vps-app-test <<EOF
    #!/usr/bin/env bash
    set -Eeuo pipefail
    echo 'Service: $APP'
    echo 'Checking ${protocol}://127.0.0.1:${port}${urlpath}'
    curl -k -sS -o /dev/null -w 'HTTP status: %{http_code}\n' --max-time 15 '${protocol}://127.0.0.1:${port}${urlpath}'
    echo 'Container status:'
    cd '$ROOT'
    docker compose ps
    EOF
      chmod 0750 /usr/local/sbin/vps-app-test
    }
    assert_debian13
    if [[ -f "$ROOT/.bootstrap-complete" ]]; then echo "$APP was provisioned already. Inspect $ROOT"; exit 0; fi
    base_packages
    
    install_docker
    
    cd "$ROOT"
    mkdir -p data
    docker pull nousresearch/hermes-agent:stable
    cat > compose.yaml <<'YAML'
    services:
      gateway:
        image: nousresearch/hermes-agent:stable
        restart: unless-stopped
        command: gateway run
        volumes:
          - ./data:/opt/data
        # NO HOST PORTS; messaging gateways connect outbound.
    YAML
    cat >/usr/local/sbin/hermes-setup <<'BASH'
    #!/usr/bin/env bash
    set -Eeuo pipefail
    cd /opt/vps-apps/06-hermes-agent
    # This is intentionally interactive: it asks for provider credentials.
    docker run -it --rm -v "$PWD/data:/opt/data" nousresearch/hermes-agent:stable setup
    docker compose up -d
    echo 'Hermes gateway started. Check docker compose logs -f gateway'
    BASH
    chmod 0750 /usr/local/sbin/hermes-setup
    cat >/usr/local/sbin/vps-app-test <<'BASH'
    #!/usr/bin/env bash
    set -Eeuo pipefail
    cd /opt/vps-apps/06-hermes-agent
    docker image inspect nousresearch/hermes-agent:stable >/dev/null
    if docker compose ps --status running -q | grep -q .; then
      docker compose ps
    else
      echo 'Image staged; run sudo hermes-setup interactively before gateway can work.'
    fi
    BASH
    chmod 0750 /usr/local/sbin/vps-app-test
    
    echo "Staged, NOT RUNNING: after SSH login run sudo hermes-setup"
    touch "$ROOT/.bootstrap-complete"
    echo "FINISHED: $APP (see $ROOT)"
runcmd:
- systemctl reload ssh || systemctl reload sshd || true
- - bash
  - /usr/local/sbin/vps-app-bootstrap
